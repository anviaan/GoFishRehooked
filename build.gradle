plugins {
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
}

tasks.register("printEnv") {
    doLast {
        def githubEnv = System.getenv("GITHUB_ENV")
        if (githubEnv == null) {
            logger.lifecycle("GITHUB_ENV is not set; release variables were not exported.")
            return
        }

        def envFile = new File(githubEnv)
        envFile.append("MOD_VERSION=${project.version}\n")
        envFile.append("RELEASE_NAME=${project.mod_name}-${project.version}\n")
        envFile.append("GAME_VERSIONS=${project.minecraft_version_range}\n")
    }
}
