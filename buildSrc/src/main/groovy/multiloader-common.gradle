plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Reposilite Anvian'
        url = 'https://maven.anvian.net/releases'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(java_version as int)
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : archiveVersion.get(),
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : archiveVersion.get(),
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
        ])
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

processResources {
    def expandProps = [
            'version'                       : project.version,
            'group'                         : project.group,
            'java_version'                  : java_version,
            'minecraft_version'             : minecraft_version,
            'minecraft_version_range'       : minecraft_version_range,
            'fabric_version'                : fabric_version,
            'fabric_loader_version'         : fabric_loader_version,
            'mod_name'                      : mod_name,
            'mod_author'                    : mod_author,
            'mod_id'                        : mod_id,
            'license'                       : license,
            'description'                   : project.description,
            'neoforge_version'              : neoforge_version,
            'neoforge_loader_version_range' : neoforge_loader_version_range,
            'credits'                       : credits,
            'anvianslib_version'            : anvianslib_version,
            'display_url'                   : display_url,
            'source_url'                    : source_url,
            'issue_tracker_url'             : issue_tracker_url,
            'modrinth_url'                  : modrinth_url,
            'curseforge_url'                : curseforge_url,
            'update_json_url'               : update_json_url
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand(expandProps)
    }
    inputs.properties(expandProps)
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = 'Reposilite'
            url = uri(version.toString().endsWith('SNAPSHOT') ?
                    'https://maven.anvian.net/snapshots' :
                    'https://maven.anvian.net/releases')
            credentials {
                username = (project.findProperty('reposilite.user') as String) ?: System.getenv('REPOSILITE_USER')
                password = (project.findProperty('reposilite.token') as String) ?: System.getenv('REPOSILITE_TOKEN')
            }
        }
    }
}
