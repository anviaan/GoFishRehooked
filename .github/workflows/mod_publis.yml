name: Mod Publish

on: [workflow_dispatch]

env:
  JAVA_VERSION: 17
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  MODRINTH_ID: ${{ vars.MODRINTH_ID }}
  CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.metadata.outputs.mod_version }}
      release_name: ${{ steps.metadata.outputs.release_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Read release metadata
        id: metadata
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "mod_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_name=Go Fish $version" >> "$GITHUB_OUTPUT"

      - name: Build all loaders
        run: ./gradlew clean build

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: 'fabric/build/libs/!(*-@(dev|sources|javadoc|shadow)).jar'

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: forge-jar
          path: 'forge/build/libs/!(*-@(dev|sources|javadoc|shadow)).jar'

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-jar
          path: 'neoforge/build/libs/!(*-@(dev|sources|javadoc|shadow)).jar'

  publish-fabric:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Fabric JAR
        uses: actions/download-artifact@v4
        with:
          name: fabric-jar
          path: fabric/build/libs/

      - name: Publish Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/*.jar
          name: ${{ needs.build.outputs.release_name }}
          version: ${{ needs.build.outputs.mod_version }}
          version-type: release
          game-versions: 1.20.2
          loaders: fabric
          dependencies: fabric-api
          java: ${{ env.JAVA_VERSION }}

  publish-forge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Forge JAR
        uses: actions/download-artifact@v4
        with:
          name: forge-jar
          path: forge/build/libs/

      - name: Publish Forge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: forge/build/libs/*.jar
          name: ${{ needs.build.outputs.release_name }}
          version: ${{ needs.build.outputs.mod_version }}
          version-type: release
          game-versions: 1.20.2
          loaders: forge
          java: ${{ env.JAVA_VERSION }}

  publish-neoforge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download NeoForge JAR
        uses: actions/download-artifact@v4
        with:
          name: neoforge-jar
          path: neoforge/build/libs/

      - name: Publish NeoForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/*.jar
          name: ${{ needs.build.outputs.release_name }}
          version: ${{ needs.build.outputs.mod_version }}
          version-type: release
          game-versions: 1.20.2
          loaders: neoforge
          java: ${{ env.JAVA_VERSION }}

  publish-maven:
    needs: [publish-fabric, publish-forge, publish-neoforge]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Publish to Reposilite
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: ./gradlew publish
